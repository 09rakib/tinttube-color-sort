<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading | TintTube</title>
<link rel="stylesheet" href="assets/tailwind.css">
<link rel="stylesheet" href="assets/ui.css">
<script src="assets/ui.js" defer></script>

  </head>
<body data-screen="splash" class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
<main class="flex flex-col relative w-full bg-surface min-h-full flex-1"><div class="flex flex-col w-full relative flex-1 items-center justify-between px-margin pt-safe pb-safe select-none overflow-hidden bg-gradient-to-b from-surface via-surface-container-low to-primary-fixed/30">
<!-- Subtle Ambient Glow Rings -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-fixed/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-96 h-96 bg-secondary-fixed/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top Spacing clearance for notch/status-bar aesthetics -->
<div class="w-full h-12" aria-hidden="true"></div>
<!-- Centerpiece Composition -->
<div class="flex flex-col items-center justify-center w-full my-auto z-10">
<!-- Test Tubes Stage -->
<div class="relative flex items-end justify-center h-64 w-72 mb-8">
<!-- Ambient Floor Drop Shadows -->
<div class="absolute bottom-2 left-6 w-16 h-3.5 bg-on-background/5 rounded-full blur-md -rotate-6"></div>
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-20 h-4 bg-on-background/10 rounded-full blur-md"></div>
<div class="absolute bottom-2 right-6 w-16 h-3.5 bg-on-background/5 rounded-full blur-md rotate-6"></div>
<!-- TUBE 1 (Left - Tilted -8deg) -->
<div class="relative w-14 h-48 -rotate-[8deg] translate-y-1 -mr-2 origin-bottom transition-transform duration-700 ease-out hover:rotate-0">
<!-- Glass Vial Shell -->
<div class="relative w-full h-full rounded-b-full rounded-t-lg bg-surface-container-lowest/30 backdrop-blur-sm p-1 shadow-lg shadow-primary-container/10 flex flex-col justify-end overflow-hidden" style="box-shadow: inset 2px 2px 5px rgba(255,255,255,0.9), inset -2px -2px 5px rgba(103,89,232,0.15), 0 10px 25px -4px rgba(36,36,58,0.12);">
<!-- Liquid Block 2 (Teal) -->
<div class="relative w-full h-1/2 bg-secondary flex flex-col items-center justify-center">
<!-- Meniscus Surface Curve -->
<div class="absolute -top-2 left-0 right-0 h-4 bg-secondary rounded-full opacity-90 scale-x-105"></div>
<!-- Specular Highlight Curve -->
<div class="absolute -top-1 left-2 right-2 h-1 bg-surface-container-lowest/50 rounded-full"></div>
<!-- Dual-encoding symbol for accessibility -->
<span class="material-symbols-outlined text-surface-container-lowest/40 text-lg select-none" aria-hidden="true">water_drop</span>
<!-- Micro bubble -->
<div class="absolute bottom-2 right-3 w-1.5 h-1.5 bg-surface-container-lowest/60 rounded-full"></div>
</div>
<!-- Liquid Block 1 (Iris Purple) -->
<div class="relative w-full h-1/2 bg-primary-container rounded-b-full flex flex-col items-center justify-center">
<!-- Meniscus Divider -->
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-primary-container rounded-full opacity-90 scale-x-105"></div>
<!-- Dual-encoding symbol -->
<span class="material-symbols-outlined text-surface-container-lowest/40 text-lg select-none mb-2" aria-hidden="true">star</span>
<!-- Liquid Bottom Reflection -->
<div class="absolute bottom-1 w-6 h-1.5 bg-surface-container-lowest/30 rounded-full blur-[0.5px]"></div>
</div>
<!-- Outer Glass Tube Rim (Lip) -->
<div class="absolute top-0 left-0 right-0 h-2 bg-surface-container-lowest/90 rounded-full shadow-sm"></div>
<!-- Left Specular Reflection Streak -->
<div class="absolute top-2 bottom-3 left-1.5 w-1 bg-gradient-to-b from-surface-container-lowest/80 via-surface-container-lowest/30 to-transparent rounded-full pointer-events-none"></div>
<!-- Right Subtle Reflection Streak -->
<div class="absolute top-4 bottom-5 right-1.5 w-0.5 bg-surface-container-lowest/40 rounded-full pointer-events-none"></div>
</div>
</div>
<!-- TUBE 2 (Center - Hero / Upright) -->
<div class="relative w-16 h-56 z-20 transition-transform duration-500 ease-out hover:scale-105">
<!-- Floating Highlight Pill Over Rim -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-1.5 bg-surface-container-lowest/80 rounded-full blur-[1px] z-30"></div>
<!-- Glass Vial Shell -->
<div class="relative w-full h-full rounded-b-full rounded-t-lg bg-surface-container-lowest/35 backdrop-blur-md p-1 flex flex-col justify-end overflow-hidden" style="box-shadow: inset 2.5px 2px 6px rgba(255,255,255,0.95), inset -2.5px -2px 6px rgba(103,89,232,0.18), 0 16px 32px -6px rgba(36,36,58,0.16);">
<!-- Liquid Block 3 (Ruby Error Tint) -->
<div class="relative w-full h-1/4 bg-error flex flex-col items-center justify-center">
<!-- Liquid Meniscus Top -->
<div class="absolute -top-2 left-0 right-0 h-4 bg-error rounded-full opacity-90 scale-x-105"></div>
<div class="absolute -top-1 left-2.5 right-2.5 h-1 bg-surface-container-lowest/60 rounded-full"></div>
<!-- Dual Encoding Glyph -->
<span class="material-symbols-outlined text-surface-container-lowest/40 text-sm select-none" aria-hidden="true">favorite</span>
</div>
<!-- Liquid Block 2 (Aqua Teal) -->
<div class="relative w-full h-1/4 bg-secondary flex flex-col items-center justify-center">
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-secondary rounded-full opacity-90 scale-x-105"></div>
<span class="material-symbols-outlined text-surface-container-lowest/40 text-sm select-none" aria-hidden="true">water_drop</span>
<div class="absolute top-2 left-3 w-1.5 h-1.5 bg-surface-container-lowest/50 rounded-full"></div>
</div>
<!-- Liquid Block 1 (Warm Gold / Honey Amber) -->
<div class="relative w-full h-2/4 bg-tertiary-container rounded-b-full flex flex-col items-center justify-center">
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-tertiary-container rounded-full opacity-90 scale-x-105"></div>
<span class="material-symbols-outlined text-surface-container-lowest/40 text-lg select-none mb-4" aria-hidden="true">light_mode</span>
<!-- Deep Core Glow -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-8 h-3 bg-tertiary-fixed-dim/50 rounded-full blur-[2px]"></div>
</div>
<!-- Top Rim -->
<div class="absolute top-0 left-0 right-0 h-2.5 bg-surface-container-lowest/95 rounded-full shadow-sm"></div>
<!-- Left Heavy Specular Streak -->
<div class="absolute top-2 bottom-4 left-1.5 w-1.5 bg-gradient-to-b from-surface-container-lowest/90 via-surface-container-lowest/40 to-transparent rounded-full pointer-events-none"></div>
<!-- Right Glint Streak -->
<div class="absolute top-5 bottom-6 right-2 w-0.5 bg-surface-container-lowest/50 rounded-full pointer-events-none"></div>
</div>
</div>
<!-- TUBE 3 (Right - Tilted +8deg) -->
<div class="relative w-14 h-48 rotate-[8deg] translate-y-1 -ml-2 origin-bottom transition-transform duration-700 ease-out hover:rotate-0">
<!-- Glass Vial Shell -->
<div class="relative w-full h-full rounded-b-full rounded-t-lg bg-surface-container-lowest/30 backdrop-blur-sm p-1 shadow-lg shadow-primary-container/10 flex flex-col justify-end overflow-hidden" style="box-shadow: inset 2px 2px 5px rgba(255,255,255,0.9), inset -2px -2px 5px rgba(103,89,232,0.15), 0 10px 25px -4px rgba(36,36,58,0.12);">
<!-- Liquid Block 3 (Sunny Yellow Amber) -->
<div class="relative w-full h-1/3 bg-tertiary-container flex flex-col items-center justify-center">
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-tertiary-container rounded-full opacity-90 scale-x-105"></div>
<div class="absolute -top-1 left-2 right-2 h-1 bg-surface-container-lowest/50 rounded-full"></div>
<span class="material-symbols-outlined text-surface-container-lowest/40 text-base select-none" aria-hidden="true">light_mode</span>
</div>
<!-- Liquid Block 2 (Iris Purple) -->
<div class="relative w-full h-1/3 bg-primary-container flex flex-col items-center justify-center">
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-primary-container rounded-full opacity-90 scale-x-105"></div>
<span class="material-symbols-outlined text-surface-container-lowest/40 text-base select-none" aria-hidden="true">star</span>
<div class="absolute top-2 right-2.5 w-1 h-1 bg-surface-container-lowest/60 rounded-full"></div>
</div>
<!-- Liquid Block 1 (Aqua Teal) -->
<div class="relative w-full h-1/3 bg-secondary rounded-b-full flex flex-col items-center justify-center">
<div class="absolute -top-2 left-0 right-0 h-3.5 bg-secondary rounded-full opacity-90 scale-x-105"></div>
<span class="material-symbols-outlined text-surface-container-lowest/40 text-base select-none mb-2" aria-hidden="true">water_drop</span>
<div class="absolute bottom-1 w-6 h-1 bg-surface-container-lowest/40 rounded-full blur-[0.5px]"></div>
</div>
<!-- Top Rim -->
<div class="absolute top-0 left-0 right-0 h-2 bg-surface-container-lowest/90 rounded-full shadow-sm"></div>
<!-- Left Specular Reflection Streak -->
<div class="absolute top-2 bottom-3 left-1.5 w-1 bg-gradient-to-b from-surface-container-lowest/80 via-surface-container-lowest/30 to-transparent rounded-full pointer-events-none"></div>
<!-- Right Subtle Reflection Streak -->
<div class="absolute top-4 bottom-5 right-1.5 w-0.5 bg-surface-container-lowest/40 rounded-full pointer-events-none"></div>
</div>
</div>
</div>
<!-- Brand Typography Section -->
<div class="flex flex-col items-center text-center mt-2">
<!-- Title with Playful Bubble Pop Shadow -->
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tight text-inverse-surface drop-shadow-sm flex items-center justify-center gap-0.5">
<span class="text-primary-container drop-shadow-[0_2px_8px_rgba(103,89,232,0.35)]">Tint</span><span>Tube</span>
</h1>
<!-- Subtitle Badge -->
<p class="font-label-lg text-label-lg tracking-widest uppercase text-on-surface-variant/80 mt-1.5">
        Color Sort Puzzle
      </p>
</div>
</div>
<!-- Loading Indicator Bottom Tray -->
<div class="w-full max-w-xs flex flex-col items-center mb-8 z-10 px-space-md">
<!-- Progress Bar Housing Capsule -->
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden p-0.5 shadow-inner relative flex items-center">
<!-- Filled Track (60%) -->
<div class="h-full w-3/5 bg-primary-container rounded-full relative overflow-hidden transition-all duration-300 shadow-sm" id="splash-progress" role="progressbar" aria-label="Loading TintTube" aria-valuenow="60" style="box-shadow: 0 1px 4px rgba(103,89,232,0.4);">
<!-- Glossy Shimmer Beam Animation -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-surface-container-lowest/45 to-transparent w-full -translate-x-full animate-[shimmer_1.8s_infinite]"></div>
</div>
</div>
<!-- Status Text & Loading Percentage -->
<div class="w-full flex items-center justify-between mt-2.5 px-1">
<span class="font-body-md text-body-md text-outline font-semibold tracking-wide flex items-center gap-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        Loading...
      </span>
<span class="font-label-sm text-label-sm text-outline font-bold tracking-widest" id="splash-pct">
        60%
      </span>
</div>
</div>
</div>
</main><noscript><p class="text-center"><a class="underline" href="index.html">Open TintTube</a></p></noscript>
</body>
</html>
